name: Apply football package update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update offers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()

          s = s.replace(
              'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";',
              'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";\nconst BASIC_CHECKOUT_URL = "https://pay.hotmart.com/B107438269A?checkoutMode=10";'
          )
          s = s.replace('function goCheckout(url: string) {\n  fireEvent("InitiateCheckout", 5.50);', 'function goCheckout(url: string, value: number) {\n  fireEvent("InitiateCheckout", value);')
          s = s.replace('goCheckout(PREMIUM_CHECKOUT_URL)', 'goCheckout(PREMIUM_CHECKOUT_URL, 39.90)')
          s = s.replace('$5.50', '$39.90').replace('$5,50', '$39,90')
          s = s.replace('Plan Premium', 'Plan Completo')
          s = s.replace('Plan Premium', 'Plan Completo')

          # Existing offer selector/card region: make all existing direct premium buttons open selector.
          # Add a basic checkout constant and basic option to the existing popout when possible.
          if 'BASIC_CHECKOUT_URL' not in s:
              raise SystemExit('Basic checkout constant was not added')

          # Replace remaining checkout calls with value-aware call.
          s = s.replace('goCheckout(PREMIUM_CHECKOUT_URL)', 'goCheckout(PREMIUM_CHECKOUT_URL, 39.90)')

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo 'No source changes needed'
          else
            git commit -m 'Update football package prices and basic checkout'
            git push
          fi
