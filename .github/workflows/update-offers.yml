name: Apply football package update
on: push
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          if 'BASIC_CHECKOUT_URL' in s and '$39.90' in s and '$25.90' in s:
              print('Offer update already applied')
              raise SystemExit(0)
          s = s.replace('const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";', 'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";\nconst BASIC_CHECKOUT_URL = "https://pay.hotmart.com/B107438269A?checkoutMode=10";')
          s = s.replace('function goCheckout(url: string) {\n  fireEvent("InitiateCheckout", 5.50);', 'function goCheckout(url: string, value: number) {\n  fireEvent("InitiateCheckout", value);')
          s = s.replace('$5.50', '$39.90').replace('$5,50', '$39,90')
          s = s.replace('Plan Premium', 'Plan Completo')
          s = s.replace('Premium', 'Completo')
          s = s.replace('goCheckout(PREMIUM_CHECKOUT_URL)', 'goCheckout(PREMIUM_CHECKOUT_URL, 39.90)')
          marker = 'const PREMIUM_CHECKOUT_URL ='
          if 'BASIC_CHECKOUT_URL' not in s:
              raise SystemExit('Could not add basic checkout URL')
          # Add the basic package and selector by replacing the existing pricing block and modal.
          a = s.find('          <div className="max-w-[560px] mx-auto">')
          b = s.find('\n\n      {/* Pop-out Completo */}', a)
          if b < 0:
              b = s.find('\n\n      {/* Pop-out Premium */}', a)
          if a < 0 or b < 0:
              raise SystemExit('Pricing markers not found')
          pricing = '''          <div className="grid lg:grid-cols-2 gap-6 max-w-[1050px] mx-auto items-stretch">
            <div className="relative bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-4 border-[#16a34a] shadow-[0_25px_70px_-18px_rgba(22,163,74,0.5)] lg:-translate-y-2">
              <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#16a34a] text-white px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest shadow-lg">⭐ RECOMENDADO · MEJOR VALOR</div>
              <div className="mb-7 mt-2"><h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl">Plan Completo</h3><p className="text-slate-500 font-bold italic text-sm">Todo el método + todos los bonos</p><p className="mt-3 text-[13px] font-bold bg-[#facc15]/25 border border-[#facc15] rounded-xl px-3 py-2">+2.000 ejercicios + nutrición + casa + definición + 4 bonos.</p></div>
              <div className="space-y-3 mb-8 flex-grow">{['+2.000 ejercicios organizados por posición y categoría','Rutina alimentaria completa','Entrenamientos en casa','500 entrenamientos para definir músculo','4 bonos exclusivos','Acceso vitalicio + actualizaciones','Garantía de 7 días'].map((item) => <div key={item} className="flex items-center gap-3"><div className="bg-[#16a34a] rounded-full p-1"><CheckCircle2 className="w-3.5 h-3.5 text-white" /></div><span className="text-[#0f172a] font-bold text-sm">{item}</span></div>)}</div>
              <div className="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100"><p className="text-slate-400 font-bold line-through">$89.90 USD</p><div className="text-5xl font-black text-[#0f172a]">$39.90 <span className="text-2xl text-[#16a34a]">USD</span></div></div>
              <button onClick={openPremiumOffer} className="w-full bg-[#16a34a] hover:bg-[#15803d] text-white font-black uppercase py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 text-lg">Quiero el Plan Completo <ArrowRight className="w-5 h-5" /></button>
            </div>
            <div className="bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-2 border-slate-300 shadow-xl">
              <div className="mb-7"><h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl">2.000 Ejercicios</h3><p className="text-slate-500 font-bold italic text-sm">Solo la biblioteca organizada</p><p className="mt-3 text-[13px] font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2">Organizados por posición y categoría.</p></div>
              <div className="space-y-3 mb-8 flex-grow">{['+2.000 ejercicios de fútbol','Organizados por posición','Organizados por categoría','Acceso digital inmediato','Acceso vitalicio','Garantía de 7 días'].map((item) => <div key={item} className="flex items-center gap-3"><div className="bg-slate-800 rounded-full p-1"><CheckCircle2 className="w-3.5 h-3.5 text-white" /></div><span className="text-[#0f172a] font-bold text-sm">{item}</span></div>)}</div>
              <div className="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100"><p className="text-slate-400 font-bold line-through">$49.90 USD</p><div className="text-4xl font-black text-[#0f172a]">$25.90 <span className="text-xl text-slate-700">USD</span></div></div>
              <button onClick={openPremiumOffer} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black uppercase py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 text-lg">Quiero los 2.000 Ejercicios <ArrowRight className="w-5 h-5" /></button>
            </div>
          </div>'''
          s = s[:a] + pricing + s[b:]
          a = s.find('      {/* Pop-out Completo */}')
          if a < 0: a = s.find('      {/* Pop-out Premium */}')
          b = s.find('\n\n      {/* Guarantee */}', a)
          if a < 0 or b < 0: raise SystemExit('Modal markers not found')
          modal = '''      {/* Package selector: only the two buttons below go to Hotmart */}
      <Dialog open={showPremiumPopout} onOpenChange={(open) => { if (!open) handleClosePremium(); else setShowPremiumPopout(true); }}>
        <DialogContent className="max-w-[94vw] sm:max-w-[760px] max-h-[92vh] overflow-y-auto p-0 rounded-3xl bg-white shadow-2xl">
          <div className="bg-[#0a0a0a] p-6 text-center relative"><button onClick={handleClosePremium} className="absolute right-4 top-4 text-white"><X className="w-6 h-6" /></button><div className="text-[#facc15] font-black uppercase text-xs mb-2">Elige tu paquete</div><h2 className="text-white font-black uppercase text-2xl">Dos formas de empezar</h2><p className="text-white/80 text-sm">El Plan Completo es la opción recomendada.</p></div>
          <div className="p-5 sm:p-7 grid md:grid-cols-2 gap-4">
            <div className="rounded-3xl border-4 border-[#16a34a] p-5"><div className="text-[#16a34a] text-xs font-black uppercase">Recomendado</div><h3 className="font-black uppercase text-xl">Plan Completo</h3><p className="text-slate-500 text-sm mb-4">Todo el método + bonos.</p><ul className="space-y-2 text-sm font-semibold mb-5">{['+2.000 ejercicios por posición y categoría','Nutrición de alto rendimiento','Entrenamientos en casa','500 entrenamientos de definición','4 bonos exclusivos','Acceso vitalicio','Garantía de 7 días'].map((item) => <li key={item} className="flex gap-2"><CheckCircle2 className="w-4 h-4 text-[#16a34a]" />{item}</li>)}</ul><div className="text-4xl font-black mb-4">$39.90 <span className="text-base text-[#16a34a]">USD</span></div><button onClick={() => goCheckout(PREMIUM_CHECKOUT_URL, 39.90)} className="w-full bg-[#16a34a] text-white font-black uppercase py-4 rounded-2xl">Comprar Plan Completo <ArrowRight className="inline w-5 h-5" /></button></div>
            <div className="rounded-3xl border-2 border-slate-300 p-5"><h3 className="font-black uppercase text-xl">2.000 Ejercicios</h3><p className="text-slate-500 text-sm mb-4">Solo la biblioteca organizada.</p><ul className="space-y-2 text-sm font-semibold mb-5">{['+2.000 ejercicios de fútbol','Por posición','Por categoría','Acceso inmediato','Acceso vitalicio','Garantía de 7 días'].map((item) => <li key={item} className="flex gap-2"><CheckCircle2 className="w-4 h-4 text-slate-700" />{item}</li>)}</ul><div className="text-4xl font-black mb-4">$25.90 <span className="text-base text-slate-700">USD</span></div><button onClick={() => goCheckout(BASIC_CHECKOUT_URL, 25.90)} className="w-full bg-slate-900 text-white font-black uppercase py-4 rounded-2xl">Comprar 2.000 Ejercicios <ArrowRight className="inline w-5 h-5" /></button></div>
          </div><p className="text-center text-[10px] text-slate-400 font-bold uppercase pb-5"><Lock className="inline w-3.5 h-3.5" /> Pago 100% seguro · Hotmart</p>
        </DialogContent>
      </Dialog>'''
          s = s[:a] + modal + s[b:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Implement two football packages"
          git push
