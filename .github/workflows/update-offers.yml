name: Apply football package update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update offers
        run: |
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace('const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";', 'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";\nconst BASIC_CHECKOUT_URL = "https://pay.hotmart.com/B107438269A?checkoutMode=10";')
          s = s.replace('function goCheckout(url: string) {\n  fireEvent("InitiateCheckout", 5.50);', 'function goCheckout(url: string, value: number) {\n  fireEvent("InitiateCheckout", value);')
          s = s.replace('goCheckout(PREMIUM_CHECKOUT_URL)', 'goCheckout(PREMIUM_CHECKOUT_URL, 39.90)')
          s = s.replace('Plan Premium', 'Plan Completo')
          s = s.replace('$5.50', '$39.90').replace('$5,50', '$39,90')
          if 'BASIC_CHECKOUT_URL' not in s:
              raise SystemExit('Basic checkout constant missing')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update football package prices and basic checkout'
          git push origin HEAD:main
