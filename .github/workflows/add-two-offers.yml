name: Add two offers
on:
  workflow_dispatch:
  push:
    paths:
      - 'add-two-offers.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update pricing cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/routes/index.tsx').read_text()
          marker='      {/* Offer / pricing */}'
          pos=s.index(marker)
          start=s.index('          <div className="max-w-[560px] mx-auto">', pos)
          end=s.index('      {/* Package selector */}', start)
          new='''          <div className="grid md:grid-cols-2 gap-5 max-w-[1100px] mx-auto items-stretch">
            {/* Plan Completo - recommended */}
            <div className="relative group bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-2 border-[#16a34a] shadow-[0_20px_50px_-12px_rgba(22,163,74,0.3)] transform transition-all duration-500 hover:scale-[1.02]">
              <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#16a34a] text-white px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest shadow-lg flex items-center gap-2 whitespace-nowrap">
                <Sparkles className="w-4 h-4 text-[#facc15]" />
                RECOMENDADO · MEJOR VALOR
              </div>
              <div className="mb-7">
                <h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl mb-1">Plan Completo</h3>
                <p className="text-slate-500 font-bold italic text-sm">Biblioteca Completa + Todos los Bonos</p>
                <p className="mt-3 text-[13px] font-bold text-[#0a0a0a] bg-[#facc15]/25 border border-[#facc15] rounded-xl px-3 py-2">
                  El <b>93% de los compradores</b> eligen el Plan Completo porque elimina la improvisación y entrega todo organizado.
                </p>
              </div>
              <div className="space-y-3 mb-8 flex-grow text-sm font-semibold text-slate-700">
                {[
                  "+2.000 entrenamientos organizados por posición y categoría",
                  "Rutina alimentaria completa de atletas de alto rendimiento",
                  "Recetas estratégicas para energía, recuperación y rendimiento",
                  "Entrenamientos individuales en casa que usan jugadores profesionales",
                  "500 entrenamientos de definición muscular (bono exclusivo de hoy)",
                  "4 bonos adicionales",
                  "Acceso vitalicio + actualizaciones automáticas",
                  "Garantía total de 7 días",
                ].map((item)=><div key={item} className="flex items-start gap-2"><CheckCircle2 className="w-5 h-5 text-[#16a34a] shrink-0" />{item}</div>)}
              </div>
              <div className="mb-5">
                <span className="text-slate-400 line-through font-bold text-lg">$29.90</span>
                <div className="text-4xl font-black text-[#0a0a0a]">$39.90 <span className="text-base text-[#16a34a]">USD</span></div>
                <p className="text-xs text-slate-500 font-semibold mt-1">Acceso inmediato · Pago único</p>
              </div>
              <button onClick={openPremiumOffer} className="w-full bg-[#16a34a] hover:bg-[#15803d] active:scale-[0.98] text-white font-black uppercase py-5 rounded-2xl shadow-[0_10px_25px_-5px_rgba(22,163,74,0.4)] transition-all flex items-center justify-center gap-2 text-base">
                SÍ, QUIERO DEJAR DE IMPROVISAR AHORA
                <ArrowRight className="w-5 h-5" />
              </button>
            </div>

            {/* 2.000 Ejercicios - entry option */}
            <div className="relative group bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-2 border-slate-300 shadow-xl transition-all duration-500 hover:scale-[1.01]">
              <div className="mb-7">
                <span className="inline-flex bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest mb-3">Opción económica</span>
                <h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl mb-1">2.000 Ejercicios</h3>
                <p className="text-slate-500 font-bold italic text-sm">La biblioteca esencial para dejar de buscar material suelto</p>
                <p className="mt-3 text-[13px] font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                  Ideal si quieres acceder a los ejercicios organizados sin llevarte los extras del Plan Completo.
                </p>
              </div>
              <div className="space-y-3 mb-8 flex-grow text-sm font-semibold text-slate-700">
                {[
                  "+2.000 entrenamientos de fútbol",
                  "Organizados por posición",
                  "Organizados por categoría",
                  "Listos para aplicar hoy",
                  "Acceso inmediato",
                  "Acceso vitalicio + actualizaciones automáticas",
                  "Garantía total de 7 días",
                ].map((item)=><div key={item} className="flex items-start gap-2"><CheckCircle2 className="w-5 h-5 text-slate-700 shrink-0" />{item}</div>)}
              </div>
              <div className="mb-5">
                <div className="text-4xl font-black text-[#0a0a0a]">$25.90 <span className="text-base text-slate-600">USD</span></div>
                <p className="text-xs text-slate-500 font-semibold mt-1">Acceso inmediato · Pago único</p>
              </div>
              <button onClick={()=>goCheckout(BASIC_CHECKOUT_URL,25.90)} className="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-black uppercase py-5 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                QUIERO SESIONES LISTAS Y ORGANIZADAS
                <ArrowRight className="w-5 h-5" />
              </button>
            </div>
          </div>

'''
          s=s[:start]+new+s[end:]
          Path('src/routes/index.tsx').write_text(s)
          print('pricing updated')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          git diff --cached --quiet || git commit -m 'feat: show both purchase options on pricing section'
          git push
