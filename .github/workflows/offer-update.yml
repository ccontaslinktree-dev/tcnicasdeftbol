name: Update two product packages

on:
  push:
    branches: [main]

jobs:
  update-offers:
    if: ${{ !contains(github.event.head_commit.message, '[offer-update]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update offer structure
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/index.tsx')
          s = path.read_text()

          # Checkout URLs and event values
          s = s.replace(
              'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";',
              'const PREMIUM_CHECKOUT_URL = "https://pay.hotmart.com/P107284207G?checkoutMode=10";\nconst BASIC_CHECKOUT_URL = "https://pay.hotmart.com/B107478096K?checkoutMode=10";'
          )
          s = s.replace('function goCheckout(url: string) {\n  fireEvent("InitiateCheckout", 5.50);', 'function goCheckout(url: string, value: number) {\n  fireEvent("InitiateCheckout", value);')

          # Every CTA opens the package selector; only package buttons call goCheckout.
          s = s.replace('showPremiumPopout', 'showOfferSelector')
          s = s.replace('openPremiumOffer', 'openOfferSelector')
          s = s.replace('handleClosePremium', 'handleCloseOffer')
          s = s.replace('setShowOfferSelector', 'setShowOfferSelector')
          s = s.replace('Plan Premium', 'Plan Completo')
          s = s.replace('$5.50', '$39.90')
          s = s.replace('5.50', '39.90')
          s = s.replace('81%', '55%')
          s = s.replace('$29.90', '$89.90')

          # Make the main offer selector explicit and create two packages on the pricing section.
          s = s.replace(
              '  const [showOfferSelector, setShowOfferSelector] = useState(false);',
              '  const [showOfferSelector, setShowOfferSelector] = useState(false);'
          )

          old_pricing = '''          <div className="max-w-[560px] mx-auto">
            {/* Plan Completo - On page */
            <div className="relative group bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-2 border-[#16a34a] shadow-[0_20px_50px_-12px_rgba(22,163,74,0.3)] transform transition-all duration-500 hover:scale-[1.02]">
              <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#16a34a] text-white px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest shadow-lg flex items-center gap-2 whitespace-nowrap">
                <Sparkles className="w-4 h-4 text-[#facc15]" />
                RECOMENDADO · MEJOR VALOR
              </div>
              
              <div className="mb-8">
                <h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl mb-1">Plan Completo</h3>
                <p className="text-slate-500 font-bold italic text-sm">Biblioteca Completa + Todos los Bonos</p>
                <p className="mt-3 text-[13px] font-bold text-[#0a0a0a] bg-[#facc15]/25 border border-[#facc15] rounded-xl px-3 py-2">
                  El <b>93% de los compradores</b> eligen el Plan Completo porque lleva el sistema completo.
                </p>
              </div>

              <div className="space-y-4 mb-10 flex-grow">
                {[
                  "+2.000 entrenamientos organizados por posición y categoría",
                  "Rutina alimentaria completa de atletas de alto rendimiento",
                  "Recetas para energía, recuperación y rendimiento",
                  "Entrenamientos individuales en casa de profesionales",
                  "500 entrenamientos de definición muscular (bono de hoy)",
                  "4 Bonos adicionales para acelerar resultados",
                  "Acceso vitalicio + actualizaciones automáticas",
                  "Garantía total de 7 días",
                ].map((item) => (
                  <div key={item} className="flex items-center gap-3">
                    <div className="bg-[#16a34a] rounded-full p-1 shrink-0">
                      <CheckCircle2 className="w-3.5 h-3.5 text-white" />
                    </div>
                    <span className="text-[#0f172a] font-bold text-sm tracking-tight">{item}</span>
                  </div>
                ))}
              </div>

              <div className="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100">
                <p className="text-slate-400 font-bold text-xl line-through leading-none">$89.90</p>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-5xl font-black text-[#0f172a]">$39.90</span>
                  <span className="text-2xl font-black text-[#16a34a]">USD</span>
                </div>
                <div className="mt-4 flex items-center gap-3">
                  <div className="bg-[#facc15] text-[#0a0a0a] px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider shadow-sm">
                    Mejor Oferta
                  </div>
                  <div className="flex items-center gap-1 text-[#dc2626] font-black text-xs uppercase tracking-tight animate-pulse">
                    <Clock className="w-4 h-4" /> Oferta por tiempo limitado
                  </div>
                </div>
              </div>

              <button
                onClick={openOfferSelector}
                className="w-full bg-[#16a34a] hover:bg-[#15803d] active:scale-[0.98] text-white font-black uppercase py-5 rounded-2xl shadow-[0_10px_25px_-5px_rgba(22,163,74,0.4)] transition-all flex items-center justify-center gap-3 text-lg"
              >
                Sí, quiero el Plan Completo
                <ArrowRight className="w-5 h-5" />
              </button>
            </div>
          </div>'''

          # The exact old block can differ after previous edits; replace from pricing wrapper to popout marker.
          pattern = re.compile(r'          <div className="max-w-\[560px\] mx-auto">.*?\n          </div>\n\n\n      \{\/\* Pop-out Premium \*\/\}', re.S)
          new_pricing = '''          <div className="grid lg:grid-cols-2 gap-6 max-w-[1050px] mx-auto items-stretch">
            {/* Plan Completo — PRIORIDAD */}
            <div className="relative group bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-4 border-[#16a34a] shadow-[0_25px_70px_-18px_rgba(22,163,74,0.5)] transform transition-all duration-500 hover:scale-[1.02] lg:-translate-y-2">
              <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#16a34a] text-white px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest shadow-lg flex items-center gap-2 whitespace-nowrap">
                <Sparkles className="w-4 h-4 text-[#facc15]" /> RECOMENDADO · MEJOR VALOR
              </div>
              <div className="mb-7 mt-2">
                <h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl mb-1">Plan Completo</h3>
                <p className="text-slate-500 font-bold italic text-sm">El sistema completo para evolucionar dentro y fuera del campo</p>
                <p className="mt-3 text-[13px] font-bold text-[#0a0a0a] bg-[#facc15]/25 border border-[#facc15] rounded-xl px-3 py-2">⭐ <b>La opción recomendada:</b> +2.000 ejercicios + nutrición + casa + definición + 4 bonos.</p>
              </div>
              <div className="space-y-3 mb-8 flex-grow">
                {[
                  "+2.000 ejercicios organizados por posición y categoría",
                  "Rutina alimentaria completa de alto rendimiento",
                  "Entrenamientos en casa",
                  "500 entrenamientos para definir músculo",
                  "4 bonos exclusivos incluidos",
                  "Acceso vitalicio + actualizaciones",
                  "Garantía total de 7 días",
                ].map((item) => (
                  <div key={item} className="flex items-center gap-3"><div className="bg-[#16a34a] rounded-full p-1 shrink-0"><CheckCircle2 className="w-3.5 h-3.5 text-white" /></div><span className="text-[#0f172a] font-bold text-sm">{item}</span></div>
                ))}
              </div>
              <div className="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100">
                <p className="text-slate-400 font-bold text-lg line-through">$89.90 USD</p>
                <div className="flex items-baseline gap-2"><span className="text-5xl font-black text-[#0f172a]">$39.90</span><span className="text-2xl font-black text-[#16a34a]">USD</span></div>
                <span className="inline-block mt-3 bg-[#facc15] text-[#0a0a0a] px-3 py-1.5 rounded-lg text-xs font-black uppercase">Plan recomendado</span>
              </div>
              <button onClick={openOfferSelector} className="w-full bg-[#16a34a] hover:bg-[#15803d] text-white font-black uppercase py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 text-lg">Quiero el Plan Completo <ArrowRight className="w-5 h-5" /></button>
            </div>

            {/* 2.000 Ejercicios */}
            <div className="relative group bg-white rounded-[32px] p-6 sm:p-8 flex flex-col border-2 border-slate-300 shadow-xl transition-all duration-500 hover:scale-[1.01]">
              <div className="mb-7">
                <h3 className="text-[#0a0a0a] font-black uppercase text-2xl sm:text-3xl mb-1">2.000 Ejercicios</h3>
                <p className="text-slate-500 font-bold italic text-sm">Biblioteca organizada por posición y categoría</p>
                <p className="mt-3 text-[13px] font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2">Ideal si buscas únicamente la biblioteca de ejercicios de fútbol.</p>
              </div>
              <div className="space-y-3 mb-8 flex-grow">
                {[
                  "+2.000 ejercicios de fútbol",
                  "Organizados por posición",
                  "Organizados por categoría",
                  "Acceso digital inmediato",
                  "Acceso vitalicio",
                  "Garantía de 7 días",
                ].map((item) => (
                  <div key={item} className="flex items-center gap-3"><div className="bg-slate-800 rounded-full p-1 shrink-0"><CheckCircle2 className="w-3.5 h-3.5 text-white" /></div><span className="text-[#0f172a] font-bold text-sm">{item}</span></div>
                ))}
              </div>
              <div className="bg-slate-50 rounded-2xl p-5 mb-6 border border-slate-100">
                <p className="text-slate-400 font-bold text-lg line-through">$49.90 USD</p>
                <div className="flex items-baseline gap-2"><span className="text-4xl font-black text-[#0f172a]">$25.90</span><span className="text-xl font-black text-slate-700">USD</span></div>
                <span className="inline-block mt-3 bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-black uppercase">Biblioteca esencial</span>
              </div>
              <button onClick={openOfferSelector} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black uppercase py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 text-lg">Quiero los 2.000 Ejercicios <ArrowRight className="w-5 h-5" /></button>
            </div>
          </div>


      {/* Pop-out Premium */*/}'''
          if not pattern.search(s):
              raise SystemExit('pricing block marker not found')
          s = pattern.sub(new_pricing, s, count=1)

          # Replace the existing single-product dialog with the two-package selector.
          dialog_pattern = re.compile(r'      /\* Pop-out Premium \*/.*?      </Dialog>', re.S)
          new_dialog = '''      {/* Package selector — only these buttons go to Hotmart */}
      <Dialog open={showOfferSelector} onOpenChange={(open) => {
        if (!open) handleCloseOffer();
        else setShowOfferSelector(true);
      }}>
        <DialogContent className="max-w-[94vw] sm:max-w-[760px] max-h-[92vh] overflow-y-auto p-0 border-none rounded-3xl bg-white shadow-2xl">
          <div className="bg-[#0a0a0a] p-5 sm:p-6 text-center relative">
            <button onClick={handleCloseOffer} className="absolute right-4 top-4 text-white/70 hover:text-white"><X className="w-6 h-6" /></button>
            <div className="bg-[#16a34a] text-white rounded-full px-4 py-1.5 inline-flex items-center gap-2 mb-2"><Sparkles className="w-4 h-4 text-[#facc15]" /><span className="text-xs font-black uppercase tracking-wider">Elige tu paquete</span></div>
            <h2 className="text-white font-black uppercase text-2xl sm:text-3xl leading-tight">Dos formas de empezar</h2>
            <p className="text-white/80 text-sm mt-1">El Plan Completo tiene prioridad porque reúne todo el sistema.</p>
          </div>

          <div className="p-5 sm:p-7 grid md:grid-cols-2 gap-4">
            <div className="relative rounded-3xl border-4 border-[#16a34a] bg-white p-5 shadow-lg">
              <div className="absolute -top-3 left-5 bg-[#16a34a] text-white px-3 py-1 rounded-full text-[10px] font-black uppercase">Recomendado</div>
              <h3 className="font-black uppercase text-xl mt-2">Plan Completo</h3>
              <p className="text-slate-500 text-sm font-medium mb-4">Todo el método + bonos.</p>
              <ul className="space-y-2 text-sm font-semibold mb-5">
                {['+2.000 ejercicios por posición y categoría','Nutrición de alto rendimiento','Entrenamientos en casa','500 entrenamientos de definición','4 bonos exclusivos','Acceso vitalicio + actualizaciones','Garantía de 7 días'].map((item) => <li key={item} className="flex gap-2"><CheckCircle2 className="w-4 h-4 text-[#16a34a] shrink-0 mt-0.5" />{item}</li>)}
              </ul>
              <div className="mb-4"><span className="text-slate-400 line-through font-bold">$89.90</span><div className="text-4xl font-black">$39.90 <span className="text-base text-[#16a34a]">USD</span></div></div>
              <button onClick={() => goCheckout(PREMIUM_CHECKOUT_URL, 39.90)} className="w-full bg-[#16a34a] hover:bg-[#15803d] text-white font-black uppercase py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2">Comprar Plan Completo <ArrowRight className="w-5 h-5" /></button>
            </div>

            <div className="rounded-3xl border-2 border-slate-300 bg-white p-5 shadow-lg">
              <h3 className="font-black uppercase text-xl mt-2">2.000 Ejercicios</h3>
              <p className="text-slate-500 text-sm font-medium mb-4">Solo la biblioteca de ejercicios.</p>
              <ul className="space-y-2 text-sm font-semibold mb-5">
                {['+2.000 ejercicios de fútbol','Organizados por posición','Organizados por categoría','Acceso inmediato','Acceso vitalicio','Garantía de 7 días'].map((item) => <li key={item} className="flex gap-2"><CheckCircle2 className="w-4 h-4 text-slate-700 shrink-0 mt-0.5" />{item}</li>)}
              </ul>
              <div className="mb-4"><span className="text-slate-400 line-through font-bold">$49.90</span><div className="text-4xl font-black">$25.90 <span className="text-base text-slate-700">USD</span></div></div>
              <button onClick={() => goCheckout(BASIC_CHECKOUT_URL, 25.90)} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black uppercase py-4 rounded-2xl shadow-xl flex items-center justify-center gap-2">Comprar 2.000 Ejercicios <ArrowRight className="w-5 h-5" /></button>
            </div>
          </div>
          <p className="text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest pb-5 flex items-center justify-center gap-2"><Lock className="w-3.5 h-3.5" /> Pago 100% seguro · Acceso instantáneo por Hotmart</p>
        </DialogContent>
      </Dialog>'''
          if not dialog_pattern.search(s):
              raise SystemExit('dialog block marker not found')
          s = dialog_pattern.sub(new_dialog, s, count=1)

          # All direct checkout calls must be only the two package buttons.
          s = s.replace('goCheckout(PREMIUM_CHECKOUT_URL)', 'goCheckout(PREMIUM_CHECKOUT_URL, 39.90)')
          s = s.replace('goCheckout(BASIC_CHECKOUT_URL)', 'goCheckout(BASIC_CHECKOUT_URL, 25.90)')

          # Update remaining visible copy tied to the old single package.
          s = s.replace('El arsenal <span className="text-[#16a34a]">completo</span> del Plan Completo', 'El arsenal <span className="text-[#16a34a]">completo</span> del Plan Completo')
          s = s.replace('Hoy te llevas TODO por solo <span className="text-[#16a34a]">$39,90</span>', 'Hoy te llevas TODO por solo <span className="text-[#16a34a]">$39.90</span>')
          s = s.replace('Quiero todo por $39,90', 'Quiero todo por $39.90')
          s = s.replace('Quiero el Plan Completo - $39.90 USD', 'Quiero el Plan Completo - $39.90 USD')

          path.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/offer-update.yml
          git add src/routes/index.tsx .github/workflows/offer-update.yml
          git commit -m "Implement two package offers [offer-update]"
          git push
