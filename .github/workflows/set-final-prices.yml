name: Set Final Offer Prices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update prices
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('src/routes/index.tsx'), Path('src/routes/__root.tsx')]
          for path in files:
              text = path.read_text()
              replacements = {
                  '$14.99': '$6.50',
                  '$6.99': '$4.50',
                  '14.99': '6.50',
                  '6.99': '4.50',
                  '39.90': '6.50',
                  '25.90': '4.50',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit price changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/__root.tsx
          git diff --cached --quiet || git commit -m "Update offer prices to $6.50 and $4.50"
          git push
